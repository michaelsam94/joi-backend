services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: joi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-joi}
      POSTGRES_DB: joi
    volumes:
      - joi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joi -d joi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://joi:${POSTGRES_PASSWORD:-joi}@db:5432/joi
    ports:
      - "4001:3000"
    volumes:
      - joi_uploads:/app/uploads
      # Google service-account key for the Drive/Sheets export feature — a plain file on the VPS
      # host at ./google-service-account.json (gitignored, never committed), read-only inside the
      # container at the path GOOGLE_SERVICE_ACCOUNT_JSON in .env already points at. Must exist on
      # the host BEFORE `docker compose up`, or Docker bind-mounts an empty directory there instead
      # of failing — see the deploy notes for how to place it.
      - ./google-service-account.json:/app/google-service-account.json:ro

volumes:
  joi_pgdata:
  joi_uploads:
